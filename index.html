<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">

    <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصريف الأفعال الفرنسية في الماضي - الأستاذ ضامن</title>
    <style>
        body {
            font-family: 'Cairo', Tahoma, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 99%, #fad0c4 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 35px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            text-align: center;
            width: 420px;
            border: 4px solid #ff6b6b;
        }
        h1 {
            color: #ff6b6b;
            font-size: 24px;
            margin-bottom: 5px;
        }
        .teacher-name {
            background: linear-gradient(45deg, #ff7675, #fab1a0);
            color: white;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 15px;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(255, 118, 117, 0.4);
        }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #2d3436;
            font-weight: bold;
        }
        select, input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dfe6e9;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        select:focus, input:focus {
            border-color: #0984e3;
            box-shadow: 0 0 8px rgba(9, 132, 227, 0.3);
        }
        button {
            background: linear-gradient(45deg, #00b894, #00cec9);
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
            transition: transform 0.2s, background 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            background: linear-gradient(45deg, #00cec9, #0984e3);
        }
        .result-box {
            margin-top: 25px;
            background: #f1f2f6;
            padding: 15px;
            border-radius: 15px;
            text-align: left;
            direction: ltr;
            min-height: 120px;
            border: 2px dashed #74b9ff;
        }
        .result-box h3 {
            text-align: center;
            color: #2d3436;
            margin-top: 0;
            font-family: 'Cairo', sans-serif;
        }
        .conjugation-item {
            font-size: 15px;
            color: #2f3640;
            margin: 6px 0;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تصريف الأفعال الفرنسية</h1>
        <div class="teacher-name">إعداد الأستاذ ضامن</div>

        <div class="input-group">
            <label style="text-align: right;">اختر أو اكتب فعلاً (المصدر):</label>
            <select id="verbSelect" onchange="document.getElementById('customVerb').value = this.value;">
                <option value="parler">Parler (المجموعة الأولى - être/avoir)</option>
                <option value="finir">Finir (المجموعة الثانية)</option>
                <option value="aller">Aller (فعل حركة - يأخذ être)</option>
                <option value="venir">Venir (فعل حركة - يأخذ être)</option>
                <option value="prendre">Prendre (المجموعة الثالثة)</option>
                <option value="faire">Faire (المجموعة الثالثة)</option>
                <option value="être">Être (فعل مساعد)</option>
                <option value="avoir">Avoir (فعل مساعد)</option>
            </select>
        </div>

        <div class="input-group">
            <label style="text-align: right;">أو اكتب فعلاً آخر (بالفرنسية):</label>
            <input type="text" id="customVerb" placeholder="مثال: manger, sortir..." value="parler">
        </div>

        <button onclick="conjointVerb()">تصريف في الماضي (Passé Composé)</button>

        <div class="result-box">
            <h3>Résultat :</h3>
            <div id="output">اختر فعلاً واضغط على الزر...</div>
        </div>
    </div>

    <script>
        // قاعدة بيانات مبسطة لأشهر الأفعال وتصريفها في الماضي المركب Passé Composé
        const irregularVerbs = {
            "parler": { aux: "avoir", pp: "parlé" },
            "manger": { aux: "avoir", pp: "mangé" },
            "finir": { aux: "avoir", pp: "fini" },
            "choisir": { aux: "avoir", pp: "choisi" },
            "prendre": { aux: "avoir", pp: "pris" },
            "mettre": { aux: "avoir", pp: "mis" },
            "faire": { aux: "avoir", pp: "fait" },
            "dire": { aux: "avoir", pp: "dit" },
            "voir": { aux: "avoir", pp: "vu" },
            "vouloir": { aux: "avoir", pp: "voulu" },
            "pouvoir": { aux: "avoir", pp: "pu" },
            "savoir": { aux: "avoir", pp: "su" },
            "venir": { aux: "être", pp: "venu(e)(s)" },
            "aller": { aux: "être", pp: "allé(e)(s)" },
            "sortir": { aux: "être", pp: "sorti(e)(s)" },
            "partir": { aux: "être", pp: "parti(e)(s)" },
            "venir": { aux: "être", pp: "venu(e)(s)" },
            "arriver": { aux: "être", pp: "arrivé(e)(s)" },
            "entrer": { aux: "être", pp: "entré(e)(s)" },
            "rester": { aux: "être", pp: "resté(e)(s)" },
            "tomber": { aux: "être", pp: "tombé(e)(s)" },
            "naître": { aux: "être", pp: "né(e)(s)" },
            "mourir": { aux: "être", pp: "mort(e)(s)" },
            "être": { aux: "avoir", pp: "été" },
            "avoir": { aux: "avoir", pp: "eu" }
        };

        const avoirConjugation = ["ai", "as", "a", "avons", "avez", "ont"];
        const etreConjugation = ["suis", "es", "est", "sommes", "êtes", "sont"];
        const pronouns = ["Je", "Tu", "Il / Elle", "Nous", "Vous", "Ils / Elles"];

        function conjointVerb() {
            let verb = document.getElementById('customVerb').value.trim().toLowerCase();
            let outputDiv = document.getElementById('output');
            
            if (!verb) {
                outputDiv.innerHTML = "<span style='color:red;'>الرجاء إدخال فعل صحيح!</span>";
                return;
            }

            let aux = "avoir";
            let pp = "";

            // التحقق من الأفعال الشائعة أو التخمين حسب المجموعة
            if (irregularVerbs[verb]) {
                aux = irregularVerbs[verb].aux;
                pp = irregularVerbs[verb].pp;
            } else if (verb.endsWith("er")) {
                aux = "avoir";
                pp = verb.slice(0, -2) + "é";
            } else if (verb.endsWith("ir")) {
                aux = "avoir";
                pp = verb.slice(0, -2) + "i";
            } else {
                // افتراضي للأفعال غير المعروفة
                aux = "avoir";
                pp = verb + " ( irrégulier )";
            }

            let auxConj = (aux === "avoir") ? avoirConjugation : etreConjugation;
            let htmlResult = "";

            for (let i = 0; i < pronouns.length; i++) {
                let pronoun = pronouns[i];
                let auxForm = auxConj[i];
                // معالجة حالة الإدغام (J'ai بدلاً من Je ai)
                if (i === 0 && (auxForm.startsWith("a") || auxForm.startsWith("e") || auxForm.startsWith("i") || auxForm.startsWith("u"))) {
                    if (aux === "avoir") {
                        pronoun = "J'";
                    }
                }
                htmlResult += `<div class="conjugation-item"><strong>${pronoun}</strong> ${auxForm} ${pp}</div>`;
            }

            outputDiv.innerHTML = htmlResult;
        }

        // تشغيل الدالة تلقائياً عند فتح الصفحة لأول فعل
        conjointVerb();
    </script>
</body>
</html>

    <script src="/script.js"></script>
  </body>

</html>
